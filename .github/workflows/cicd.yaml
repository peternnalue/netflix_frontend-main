name: Build and push docker image

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

  
    steps:
    - name: Check out the repository
      uses: actions/checkout@v2


    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
        
# Login to ECR
#=============
    - name: Login to ECR
      run: |
      aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 358103606617.dkr.ecr.us-east-1.amazonaws.com


    - name: Docker build 
      run: |
        docker build -t movie-frontend .

    - name: Docker push
      run: |
        docker tag movie-frontend:latest 358103606617.dkr.ecr.us-east-1.amazonaws.com/movie-frontend:${GITHUB_RUN_NUMBER}
        docker push 358103606617.dkr.ecr.us-east-1.amazonaws.com/movie-frontend:latest${GITHUB_RUN_NUMBER}
